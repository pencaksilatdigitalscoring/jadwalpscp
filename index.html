<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Jadwal Pertandingan - CAHAYA DIGITAL SCORING</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <!-- html2pdf untuk Export PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #f8fafc; 
            color: #0f172a; 
            margin: 0; 
        }

        /* Memastikan warna background tercetak di PDF */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .custom-scroll { overflow: auto; }
        .custom-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .gugur-block { background-color: #e2e8f0 !important; color: #94a3b8 !important; }
        .gugur-text { text-decoration: line-through; opacity: 0.7; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- HEADER / KOP JADWAL (Tampil di Web) -->
    <header class="bg-white shadow-sm border-b border-slate-200 p-4 md:py-6 px-4 md:px-10 flex justify-between items-center z-10 sticky top-0" id="main-header">
        <!-- Logo Kiri -->
        <img src="https://iili.io/nUEj3Ss.jpg" alt="Logo Kiri" class="h-12 w-12 md:h-20 md:w-20 object-contain shadow-md rounded-full border-2 border-slate-100">
        
        <div class="text-center flex-1 px-4">
            <h1 class="text-sm md:text-2xl font-black uppercase text-amber-600 tracking-wider">KEJUARAAN PENCAK SILAT</h1>
            <h2 class="text-xs md:text-xl font-extrabold text-slate-800 mt-1 uppercase tracking-widest">PSCP CUP XII 2026</h2>
            <p class="text-[10px] md:text-sm font-semibold text-slate-500 mt-1">JADWAL PERTANDINGAN RESMI</p>
        </div>

        <!-- Logo Kanan -->
        <img src="https://iili.io/CZgpAb4.jpg" alt="Logo Kanan" class="h-12 w-12 md:h-20 md:w-20 object-contain shadow-md rounded-full border-2 border-slate-100">
    </header>

    <!-- KONTROL / MENU -->
    <div class="p-4 flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-50">
        
        <!-- Paginasi -->
        <div class="flex items-center gap-2 font-bold text-xs">
            <button onclick="prevPage()" class="px-4 py-2 bg-slate-200 rounded hover:bg-slate-300 transition-colors"><i class="fas fa-chevron-left"></i></button>
            <span id="page-info" class="px-4 py-2 bg-white border border-slate-200 rounded shadow-sm">Hal 1 / 1</span>
            <button onclick="nextPage()" class="px-4 py-2 bg-slate-200 rounded hover:bg-slate-300 transition-colors"><i class="fas fa-chevron-right"></i></button>
        </div>

        <button onclick="exportJadwalPDF()" class="w-full md:w-auto bg-amber-600 text-white font-black text-xs px-6 py-3 rounded-xl shadow-md hover:bg-amber-700 active:scale-95 transition-all flex items-center justify-center gap-2 border-b-4 border-amber-800">
            <i class="fas fa-file-pdf text-lg"></i> EXPORT PDF JADWAL
        </button>
    </div>

    <!-- WRAPPER TABEL (Tampil di Web) -->
    <div class="flex-1 p-4 md:px-10 overflow-hidden flex flex-col">
        <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden flex-1 flex flex-col">
            <div class="overflow-x-auto custom-scroll flex-1">
                <table class="w-full text-left border-collapse min-w-[800px]">
                    <thead class="bg-slate-800 text-white uppercase text-[10px] tracking-wider">
                        <tr>
                            <th class="p-3 text-center border-r border-slate-700 w-12">No</th>
                            <th class="p-3 text-center border-r border-slate-700 w-24">Fase</th>
                            <th class="p-3 text-center border-r border-slate-700 w-20">Partai</th>
                            <th class="p-3 text-center border-r border-slate-700 bg-blue-700 w-64">Sudut Biru</th>
                            <th class="p-3 text-center border-r border-slate-700">Kelas Tanding</th>
                            <th class="p-3 text-center border-r border-slate-700 bg-red-700 w-64">Sudut Merah</th>
                            <th class="p-3 text-center w-32">Score</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-xs font-semibold text-slate-700">
                        <!-- Data kerangka dirender melalui JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- WADAH TERSEMBUNYI UNTUK EXPORT PDF -->
    <div id="pdf-export-container" style="display: none; background: white;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
  apiKey: "AIzaSyAVwQw-zBMEVbRaQc2lcWfdss3l2zOhoNs",
  authDomain: "pscp-ternate.firebaseapp.com",
  databaseURL: "https://pscp-ternate-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "pscp-ternate",
  storageBucket: "pscp-ternate.firebasestorage.app",
  messagingSenderId: "1057698178770",
  appId: "1:1057698178770:web:d4ed0a01f84d26603c2f0b"
};
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const dbRef = ref(database, 'pencak_scoring_state');

        let allMatches = [];
        let parentLinks = {};
        let currentPage = 1;
        const itemsPerPage = 20;

        // Mendengarkan perubahan data dari Firebase Realtime
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.matches) { 
                // Filter hanya pertandingan yang relevan dengan skema Bracket
                allMatches = data.matches.filter(m => m.m || m.b).sort((a, b) => parseInt(a.p) - parseInt(b.p));
                buildTreeLinks(); // Rebuild relasi hirarki untuk deteksi fase
                renderTable();
            }
        });

        // -------------------------------------------------------------
        // LOGIKA PENENTUAN FASE SAMA SEPERTI BRACKET (Support Peserta vs BYE)
        // -------------------------------------------------------------
        function buildTreeLinks() {
            parentLinks = {};
            const sanitize = str => (str || "").toUpperCase().trim();

            // TAHAP 1: Relasi Eksplisit (Dari teks "PEMENANG PARTAI X")
            allMatches.forEach(m => {
                const matchB = (m.b || "").match(/PEMENANG PARTAI (\d+)/i);
                const matchM = (m.m || "").match(/PEMENANG PARTAI (\d+)/i);
                
                if (matchB) parentLinks[parseInt(matchB[1])] = m.p;
                if (matchM) parentLinks[parseInt(matchM[1])] = m.p;
            });

            // TAHAP 2: Relasi Implisit (Termasuk untuk kasus BYE)
            // Melacak nama asli peserta yang lolos ke tahap selanjutnya untuk mendeteksi kedalaman fase
            [...allMatches].sort((a, b) => parseInt(a.p) - parseInt(b.p)).forEach(m => {
                if (!parentLinks[m.p]) {
                    const names = [];
                    const bName = sanitize(m.b);
                    const mName = sanitize(m.m);
                    
                    if (bName && bName !== 'BYE' && !bName.includes('PEMENANG')) names.push(bName);
                    if (mName && mName !== 'BYE' && !mName.includes('PEMENANG')) names.push(mName);

                    for (const pName of names) {
                        // Cari partai selanjutnya di kelas yang sama di mana peserta ini bermain
                        const nextMatch = allMatches.find(later =>
                            parseInt(later.p) > parseInt(m.p) &&
                            later.kelas === m.kelas && later.cat === m.cat && later.gender === m.gender &&
                            (sanitize(later.b) === pName || sanitize(later.m) === pName)
                        );
                        if (nextMatch) {
                            parentLinks[m.p] = nextMatch.p;
                            break; 
                        }
                    }
                }
            });
        }

        // Fungsi mendapatkan Fase & Warna Kategori
        function getPhase(matchId) {
            let depth = 0;
            let currentId = matchId;
            
            // Hitung jarak partai menuju partai Final
            while(parentLinks[currentId]) {
                depth++;
                currentId = parentLinks[currentId];
            }

            if(depth === 0) return { name: "FINAL", class: "text-red-600", hex: "#dc2626" };
            if(depth === 1) return { name: "SEMI FINAL", class: "text-amber-600", hex: "#d97706" };
            if(depth === 2) return { name: "PEREMPAT FINAL", class: "text-blue-600", hex: "#2563eb" };
            return { name: "PENYISIHAN", class: "text-slate-700", hex: "#334155" };
        }

        // -------------------------------------------------------------
        // RENDER TABEL DOM
        // -------------------------------------------------------------
        window.prevPage = function() {
            if(currentPage > 1) { 
                currentPage--; 
                forceRebuild();
                renderTable(); 
            }
        }

        window.nextPage = function() {
            const totalPages = Math.ceil(allMatches.length / itemsPerPage);
            if(currentPage < totalPages) { 
                currentPage++; 
                forceRebuild(); 
                renderTable(); 
            }
        }

        function forceRebuild() {
            document.getElementById('table-body').innerHTML = '';
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            const pageInfo = document.getElementById('page-info');
            
            if(allMatches.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-10 text-slate-400 font-bold uppercase">Data Pertandingan Belum Tersedia</td></tr>`;
                pageInfo.innerText = "Hal 1 / 1";
                return;
            }

            const totalPages = Math.ceil(allMatches.length / itemsPerPage);
            if(currentPage > totalPages) currentPage = totalPages;
            pageInfo.innerText = `Hal ${currentPage} / ${totalPages}`;

            const startIdx = (currentPage - 1) * itemsPerPage;
            const endIdx = startIdx + itemsPerPage;
            const paginatedMatches = allMatches.slice(startIdx, endIdx);

            if(tbody.children.length !== paginatedMatches.length || tbody.children[0].children.length === 1) {
                tbody.innerHTML = '';
                paginatedMatches.forEach(() => {
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-slate-200 hover:bg-slate-50 transition-colors duration-200";
                    tr.innerHTML = `
                        <td class="col-no p-3 border-r border-slate-200 text-center font-bold text-slate-500"></td>
                        <td class="col-phase p-3 border-r border-slate-200 text-center text-[10px] font-black uppercase leading-tight"></td>
                        <td class="col-partai p-3 border-r border-slate-200 text-center font-black text-lg text-slate-700"></td>
                        
                        <td class="col-blue-box p-3 border-r border-slate-200 text-center transition-colors">
                            <div class="col-blue-name font-black text-sm uppercase"></div>
                            <div class="col-blue-kontingen text-[9px] mt-1 font-semibold opacity-90"></div>
                        </td>
                        
                        <td class="p-3 border-r border-slate-200 text-center">
                            <span class="col-kelas bg-slate-100 px-3 py-1 rounded border border-slate-200 font-bold uppercase text-[10px] text-slate-600 whitespace-nowrap"></span>
                        </td>
                        
                        <td class="col-red-box p-3 border-r border-slate-200 text-center transition-colors">
                            <div class="col-red-name font-black text-sm uppercase"></div>
                            <div class="col-red-kontingen text-[9px] mt-1 font-semibold opacity-90"></div>
                        </td>
                        
                        <td class="p-3 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <div class="w-7 h-7 bg-white border-2 border-blue-600 rounded shadow-sm"></div>
                                <span class="text-slate-400 font-bold text-[10px]">-</span>
                                <div class="w-7 h-7 bg-white border-2 border-red-600 rounded shadow-sm"></div>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            paginatedMatches.forEach((match, index) => {
                const tr = tbody.children[index];
                const globalIndex = startIdx + index + 1;
                
                // Mendapatkan Data Fase & Warnanya
                const phaseData = getPhase(match.p);
                
                // Status Gugur
                const isSelesai = match.status === 'selesai';
                const bGugur = isSelesai && match.winnerSide === 'merah';
                const rGugur = isSelesai && match.winnerSide === 'biru';

                const blueBoxClass = bGugur ? 'gugur-block' : 'bg-blue-600 text-white';
                const blueTextClass = bGugur ? 'gugur-text' : '';
                
                const redBoxClass = rGugur ? 'gugur-block' : 'bg-red-600 text-white';
                const redTextClass = rGugur ? 'gugur-text' : '';

                // Tulis text Node
                tr.querySelector('.col-no').innerText = globalIndex;
                
                // Tulis Info Fase beserta warna yang menyesuaikan kedalaman Bracket
                tr.querySelector('.col-phase').className = `col-phase p-3 border-r border-slate-200 text-center text-[10px] font-black uppercase leading-tight ${phaseData.class}`;
                tr.querySelector('.col-phase').innerHTML = phaseData.name.replace(' ', '<br>');
                
                tr.querySelector('.col-partai').innerText = match.p || '-';
                tr.querySelector('.col-kelas').innerText = `${match.kelas || ''} ${match.cat || ''} ${match.gender || ''}`.trim() || '-';

                // Tulis Biru
                tr.querySelector('.col-blue-box').className = `col-blue-box p-3 border-r border-slate-200 text-center transition-colors ${blueBoxClass}`;
                tr.querySelector('.col-blue-name').className = `col-blue-name font-black text-sm uppercase ${blueTextClass}`;
                tr.querySelector('.col-blue-name').innerText = match.b || 'BYE';
                tr.querySelector('.col-blue-kontingen').className = `col-blue-kontingen text-[9px] mt-1 font-semibold opacity-90 ${blueTextClass}`;
                tr.querySelector('.col-blue-kontingen').innerText = match.kb || '-';

                // Tulis Merah
                tr.querySelector('.col-red-box').className = `col-red-box p-3 border-r border-slate-200 text-center transition-colors ${redBoxClass}`;
                tr.querySelector('.col-red-name').className = `col-red-name font-black text-sm uppercase ${redTextClass}`;
                tr.querySelector('.col-red-name').innerText = match.m || 'BYE';
                tr.querySelector('.col-red-kontingen').className = `col-red-kontingen text-[9px] mt-1 font-semibold opacity-90 ${redTextClass}`;
                tr.querySelector('.col-red-kontingen').innerText = match.km || '-';
            });
        }

        // -------------------------------------------------------------
        // LOGIKA EXPORT PDF
        // -------------------------------------------------------------
        window.exportJadwalPDF = function() {
            if(allMatches.length === 0) {
                alert("Tidak ada data jadwal untuk diekspor!");
                return;
            }

            const container = document.getElementById('pdf-export-container');
            container.innerHTML = '';
            container.style.display = 'block';

            const headerHTML = document.getElementById('main-header').outerHTML;
            const totalPagesPDF = Math.ceil(allMatches.length / itemsPerPage);

            for(let i = 0; i < totalPagesPDF; i++) {
                const startIdx = i * itemsPerPage;
                const endIdx = startIdx + itemsPerPage;
                const pageMatches = allMatches.slice(startIdx, endIdx);

                let pageContent = `
                    <div style="padding: 20px; font-family: 'Montserrat', sans-serif;">
                        ${headerHTML}
                        <h3 style="text-align: center; font-size: 14px; font-weight: 800; margin: 15px 0; color: #333;">HALAMAN ${i + 1} / ${totalPagesPDF}</h3>
                        
                        <table style="width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; border: 1px solid #cbd5e1;">
                            <thead style="background-color: #1e293b; color: white; text-transform: uppercase; font-size: 10px;">
                                <tr>
                                    <th style="padding: 10px; border: 1px solid #475569; width: 5%;">No</th>
                                    <th style="padding: 10px; border: 1px solid #475569; width: 10%;">Fase</th>
                                    <th style="padding: 10px; border: 1px solid #475569; width: 8%;">Partai</th>
                                    <th style="padding: 10px; border: 1px solid #475569; background-color: #1d4ed8; width: 25%;">Sudut Biru</th>
                                    <th style="padding: 10px; border: 1px solid #475569; width: 15%;">Kelas</th>
                                    <th style="padding: 10px; border: 1px solid #475569; background-color: #b91c1c; width: 25%;">Sudut Merah</th>
                                    <th style="padding: 10px; border: 1px solid #475569; width: 12%;">Score</th>
                                </tr>
                            </thead>
                            <tbody style="color: #334155; font-weight: 600;">
                `;

                pageMatches.forEach((match, idx) => {
                    const globalIndex = startIdx + idx + 1;
                    const phaseData = getPhase(match.p);
                    const isSelesai = match.status === 'selesai';
                    const bGugur = isSelesai && match.winnerSide === 'merah';
                    const rGugur = isSelesai && match.winnerSide === 'biru';

                    const bBg = bGugur ? '#e2e8f0' : '#2563eb';
                    const bColor = bGugur ? '#94a3b8' : 'white';
                    const bDecor = bGugur ? 'text-decoration: line-through;' : '';
                    
                    const rBg = rGugur ? '#e2e8f0' : '#dc2626';
                    const rColor = rGugur ? '#94a3b8' : 'white';
                    const rDecor = rGugur ? 'text-decoration: line-through;' : '';

                    const kelasInfo = `${match.kelas || ''} ${match.cat || ''} ${match.gender || ''}`.trim() || '-';

                    pageContent += `
                        <tr style="border-bottom: 1px solid #cbd5e1;">
                            <td style="padding: 8px; border: 1px solid #cbd5e1;">${globalIndex}</td>
                            <td style="padding: 8px; border: 1px solid #cbd5e1; font-weight: 900; color: ${phaseData.hex}; font-size: 9px;">${phaseData.name.replace(' ', '<br>')}</td>
                            <td style="padding: 8px; border: 1px solid #cbd5e1; font-weight: 900; font-size: 14px;">${match.p || '-'}</td>
                            
                            <td style="padding: 8px; border: 1px solid #cbd5e1; background-color: ${bBg}; color: ${bColor}; ${bDecor}">
                                <div style="font-weight: 900; text-transform: uppercase;">${match.b || 'BYE'}</div>
                                <div style="font-size: 9px; margin-top: 4px;">${match.kb || '-'}</div>
                            </td>
                            
                            <td style="padding: 8px; border: 1px solid #cbd5e1; font-size: 9px; font-weight: 700;">${kelasInfo}</td>
                            
                            <td style="padding: 8px; border: 1px solid #cbd5e1; background-color: ${rBg}; color: ${rColor}; ${rDecor}">
                                <div style="font-weight: 900; text-transform: uppercase;">${match.m || 'BYE'}</div>
                                <div style="font-size: 9px; margin-top: 4px;">${match.km || '-'}</div>
                            </td>
                            
                            <td style="padding: 8px; border: 1px solid #cbd5e1; white-space: nowrap;">
                                <span style="display:inline-block; width: 22px; height: 16px; background: #ffffff; border: 2px solid #2563eb; border-radius: 4px; vertical-align: middle;"></span>
                                <span style="margin: 0 4px; color: #94a3b8; font-weight: bold; vertical-align: middle;">-</span>
                                <span style="display:inline-block; width: 22px; height: 16px; background: #ffffff; border: 2px solid #dc2626; border-radius: 4px; vertical-align: middle;"></span>
                            </td>
                        </tr>
                    `;
                });

                pageContent += `</tbody></table></div>`;
                if (i < totalPagesPDF - 1) pageContent += `<div class="html2pdf__page-break"></div>`;

                container.innerHTML += pageContent;
            }

            const opt = {
                margin: [5, 5, 5, 5],
                filename: 'Jadwal_Pertandingan_Kejuaraan.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(container).save().then(() => {
                container.style.display = 'none';
                container.innerHTML = '';
            });
        }
    </script>
</body>
</html>
